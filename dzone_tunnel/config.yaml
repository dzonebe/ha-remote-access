name: DZone Remote Access
version: "0.5.0"
slug: dzone_tunnel
description: Maakt Home Assistant van buitenaf bereikbaar via <naam>.ha.dzone.be
arch:
  - aarch64
  - amd64
init: false
# Lets the app read Home Assistant's HTTP settings and make it trust the tunnel
# (see run.sh); switch that off with the option configure_home_assistant.
homeassistant_api: true
options:
  subdomain: null
  configure_home_assistant: true
  servers:
    - tunnel1.dzone.be
schema:
  subdomain: "match(^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$)"
  configure_home_assistant: bool
  servers:
    - "match(^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$)"
