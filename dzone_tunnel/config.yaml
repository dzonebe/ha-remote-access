name: DZone Remote Access
version: "0.4.0"
slug: dzone_tunnel
description: Maakt Home Assistant van buitenaf bereikbaar via <naam>.ha.dzone.be
arch:
  - aarch64
  - amd64
init: false
# Lets the app add the proxy settings to configuration.yaml and restart Home
# Assistant once (see run.sh); switch off with the option below.
homeassistant_api: true
map:
  - type: homeassistant_config
    read_only: false
    path: /homeassistant
options:
  subdomain: null
  configure_home_assistant: true
  servers:
    - tunnel1.dzone.be
schema:
  subdomain: "match(^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$)"
  configure_home_assistant: bool
  servers:
    - "match(^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$)"
